name: Tests

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master
      - 'refactor/*'
  pull_request:
    branches:
      - main
      - master

jobs:
  lint-and-test:
    name: Lint + tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Unit + integration tests (Vitest)
        run: npm run test
