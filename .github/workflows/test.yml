name: Tests

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master
      - 'refactor/*'
  pull_request:
    branches:
      - main
      - master

jobs:
  lint-and-test:
    name: Lint + tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # La MISMA versión mayor que el entorno de desarrollo local: el gate
          # de pre-entrega (lint+tests+build) no debe pasar en una máquina y
          # fallar en CI por diferencias de Node (p. ej. brand checks de
          # SubtleCrypto entre realms en jsdom). Node 20 fue forzado a 24 por
          # GitHub y desaparece de los runners; 26 es la rama corriente.
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Unit + integration tests (Vitest)
        run: npm run test
